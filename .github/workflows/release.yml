name: Release

on:
  push:
    branches: [main]
    paths:
      - 'code/cli/pubspec.yaml'

defaults:
  run:
    working-directory: code/cli

jobs:
  # ─── Job 1: Verify this is a version bump ──────────────────────────────────
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec.yaml
        id: read
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Fail if tag already exists
        run: |
          if git rev-parse "${{ steps.read.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.read.outputs.tag }} already exists — skipping release."
            exit 1
          fi

  # ─── Job 2: Create GitHub release ──────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: check-version
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.check-version.outputs.tag }}" \
            --title "macss ${{ needs.check-version.outputs.tag }}" \
            --notes "See CHANGELOG.md for details." \
            --draft=false \
            --prerelease=false

  # ─── Job 3: Build and upload binaries ──────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check-version, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: macss-linux-x64.tar.gz
            binary: macss
          - os: windows-latest
            asset_name: macss-windows-x64.zip
            binary: macss.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: dart pub get
        run: dart pub get

      - name: dart test
        run: dart test

      # Windows: workaround Defender deleting dart.exe after dart test
      - name: Re-setup Dart (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dartHome = $env:DART_HOME
          if ($dartHome) {
            Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\dart" -ErrorAction SilentlyContinue
            Remove-Item -Force "D:\a\_temp\dartsdk-windows-x64-release.zip" -ErrorAction SilentlyContinue
          }
      - uses: dart-lang/setup-dart@v1
        if: runner.os == 'Windows'
        with:
          sdk: stable

      - name: Compile binary (Linux)
        if: runner.os == 'Linux'
        run: dart compile exe bin/main.dart -o bin/${{ matrix.binary }}

      - name: Compile binary (Windows)
        if: runner.os == 'Windows'
        run: dart compile exe bin/main.dart -o bin/${{ matrix.binary }}

      - name: Package (Linux — tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/bin dist/assets
          cp bin/${{ matrix.binary }} dist/bin/
          cp -r assets/* dist/assets/
          cd dist && tar czf ../${{ matrix.asset_name }} .

      - name: Package (Windows — zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\bin, dist\assets | Out-Null
          Copy-Item bin\${{ matrix.binary }} dist\bin\
          Copy-Item -Recurse assets\* dist\assets\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.asset_name }} -Force

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.check-version.outputs.tag }}" "${{ matrix.asset_name }}" --clobber
