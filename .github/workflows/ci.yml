name: CI

on:
  push:
    branches: [main]
    paths:
      - 'code/cli/**'
  pull_request:
    branches: [main]
    paths:
      - 'code/cli/**'

defaults:
  run:
    working-directory: code/cli

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: dart pub get
        run: dart pub get

      - name: dart analyze
        run: dart analyze --fatal-infos

      - name: dart test
        run: dart test
