<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 128 128" width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="64" cy="64" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotglow" cx="64" cy="64" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#22c55e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="#0D1117"/>

  <!-- Corner: Top-Left  (█▀) -->
  <rect x="16" y="16" width="10" height="38" rx="2" fill="#e6edf3"/>
  <rect x="16" y="16" width="38" height="10" rx="2" fill="#e6edf3"/>

  <!-- Corner: Top-Right (▀█) -->
  <rect x="102" y="16" width="10" height="38" rx="2" fill="#e6edf3"/>
  <rect x="74"  y="16" width="38" height="10" rx="2" fill="#e6edf3"/>

  <!-- Corner: Bottom-Left  (█▄) -->
  <rect x="16" y="74"  width="10" height="38" rx="2" fill="#e6edf3"/>
  <rect x="16" y="102" width="38" height="10" rx="2" fill="#e6edf3"/>

  <!-- Corner: Bottom-Right (▄█) -->
  <rect x="102" y="74"  width="10" height="38" rx="2" fill="#e6edf3"/>
  <rect x="74"  y="102" width="38" height="10" rx="2" fill="#e6edf3"/>

  <!-- Green dot — the fifth element -->
  <circle cx="64" cy="64" r="18" fill="url(#glow)"/>
  <circle cx="64" cy="64" r="5"  fill="url(#dotglow)"/>
  <circle cx="64" cy="64" r="2.5" fill="#ffffff"/>
</svg>
